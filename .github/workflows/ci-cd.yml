
name: Student Management CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check JavaScript syntax
        run: node --check artifacts/student-management/app.js

      - name: Run automated tests
        run: node --test scripts/tests/*.test.cjs

      - name: Check TypeScript
        run: pnpm --filter @workspace/student-management typecheck

      - name: Code quality check
        run: pnpm exec prettier --check package.json

      - name: Build application
        env:
          PORT: 5000
          BASE_PATH: /student-management-system/
        run: pnpm --filter @workspace/student-management build

      - name: Upload website for GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: artifacts/student-management/dist/public

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build-and-check
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
